
name: ZenGen Kubernetes Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        uses: bmuschko/setup-kubeconform@v1
        with:
          kubeconform-version: "0.6.7"

      - name: Validate Deployment YAML
        run: kubeconform -strict -summary devops/kubernetes/deployment.yaml

      - name: Validate Service YAML
        run: kubeconform -strict -summary devops/kubernetes/service.yaml