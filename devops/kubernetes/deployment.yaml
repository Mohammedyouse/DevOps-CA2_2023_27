
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zengen-deployment
  labels:
    app: zengen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zengen
  template:
    metadata:
      labels:
        app: zengen
    spec:
      containers:
        - name: zengen
          image: zengen:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: zengen-secrets
                  key: DATABASE_URL
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zengen-secrets
                  key: GEMINI_API_KEY
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: zengen-secrets
                  key: SESSION_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"